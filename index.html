
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                850: '#1f2937',
                900: '#111827',
                950: '#030712',
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        font-size: 18px; /* Increased base font size */
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #030712;
        color: #f3f4f6;
        height: 100vh;
        overflow: hidden;
      }
      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      /* Custom Scrollbar for Dark Theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #111827; 
      }
      ::-webkit-scrollbar-thumb {
        background: #374151; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5563; 
      }

      /* Utilities for hiding scrollbars */
      .no-scrollbar::-webkit-scrollbar, .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar, .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Markdown Report Styling */
      .markdown-body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        color: #e5e7eb;
        padding-bottom: 2rem;
      }
      .markdown-body h1 {
        font-size: 2.25em;
        font-weight: 800;
        border-bottom: 1px solid #374151;
        padding-bottom: 0.3em;
        margin-top: 1.5em;
        margin-bottom: 0.8em;
        color: #a78bfa; /* Violet-400 */
      }
      .markdown-body h2 {
        font-size: 1.75em;
        font-weight: 700;
        margin-top: 1.5em;
        margin-bottom: 0.6em;
        color: #c4b5fd; /* Violet-300 */
        border-bottom: 1px solid #1f2937;
        padding-bottom: 0.2em;
      }
      .markdown-body h3 {
        font-size: 1.4em;
        font-weight: 600;
        margin-top: 1.2em;
        margin-bottom: 0.5em;
        color: #ddd6fe; /* Violet-200 */
      }
      .markdown-body h4 {
        font-size: 1.2em;
        font-weight: 600;
        margin-top: 1em;
        margin-bottom: 0.5em;
        color: #e5e7eb;
      }
      .markdown-body p {
        margin-bottom: 1em;
      }
      .markdown-body ul {
        list-style-type: disc;
        padding-left: 2em;
        margin-bottom: 1em;
      }
      .markdown-body ol {
        list-style-type: decimal;
        padding-left: 2em;
        margin-bottom: 1em;
      }
      .markdown-body li {
        margin-bottom: 0.4em;
      }
      .markdown-body strong {
        color: #fff;
        font-weight: 700;
      }
      .markdown-body blockquote {
        border-left: 4px solid #4c1d95;
        padding-left: 1em;
        color: #9ca3af;
        margin-left: 0;
        margin-right: 0;
        background-color: #111827;
        padding: 1em;
        border-radius: 0 8px 8px 0;
      }
      .markdown-body code {
        background-color: #1f2937;
        padding: 0.2em 0.4em;
        border-radius: 3px;
        font-family: monospace;
        font-size: 0.9em;
        color: #f3f4f6;
      }
      .markdown-body pre {
        background-color: #111827;
        padding: 1em;
        border-radius: 8px;
        overflow-x: auto;
        border: 1px solid #374151;
        margin-bottom: 1em;
      }
      .markdown-body pre code {
        background-color: transparent;
        padding: 0;
        color: #e5e7eb;
      }
      .markdown-body img {
        max-width: 100%;
        border-radius: 8px;
        margin: 1.5em 0;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        border: 1px solid #374151;
      }
      .markdown-body hr {
        border: 0;
        border-top: 1px solid #374151;
        margin: 2em 0;
      }
      .markdown-body table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 1em;
        background-color: #111827;
        border-radius: 8px;
        overflow: hidden;
      }
      .markdown-body th, .markdown-body td {
        border: 1px solid #374151;
        padding: 0.75em;
        text-align: left;
      }
      .markdown-body th {
        background-color: #1f2937;
        font-weight: 700;
        color: #a78bfa;
      }
      .markdown-body tr:nth-child(even) {
        background-color: #0f1521;
      }

      @media print {
        body {
          background-color: white;
          color: black;
          overflow: visible;
        }
        #root {
          display: block;
        }
        .markdown-body {
          color: black;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body strong {
          color: black;
          border-bottom-color: #ccc;
        }
        .markdown-body table, .markdown-body th, .markdown-body td, .markdown-body hr, .markdown-body pre, .markdown-body img {
          border-color: #ccc;
          background-color: transparent;
        }
        .markdown-body tr:nth-child(even) {
          background-color: #f9f9f9;
        }
        .page-break {
          page-break-before: always;
        }
        h1, h2 {
          page-break-after: avoid;
        }
        pre, blockquote, table {
          page-break-inside: avoid;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
